name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.22.2, 24.15.0]
        # The package advertises Node 26 support. Validate the new major on
        # Linux without multiplying the full cross-platform matrix.
        include:
          - os: ubuntu-latest
            node: 26.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org/
      # Keep the Windows test mitigation observable. NODE_OPTIONS is inherited
      # by the per-file `node --test` children, so a fatal error or uncaught
      # exception writes a report before the child exits. This does not change
      # the exit code and stays disabled on non-Windows jobs.
      - name: Enable Windows Node diagnostics
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $reportDirectory = Join-Path $env:RUNNER_TEMP 'qwen-audio-node-reports'
          $logDirectory = Join-Path $env:RUNNER_TEMP 'qwen-audio-test-logs'
          New-Item -ItemType Directory -Force -Path $reportDirectory, $logDirectory | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Encoding utf8 -Value "NODE_OPTIONS=--report-on-fatalerror --report-uncaught-exception --report-directory=$reportDirectory"
      # Test the GitLab-only synchronizer against disposable local repositories.
      # GitHub Actions never runs the real synchronization job or needs its token.
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '22.22.2' }}
        run: node --test .gitlab/sync-github.test.mjs
      - run: npm ci
      # windows-latest occasionally kills a whole test file's child process: the
      # runner reports the file as `✖ <file> ... 'test failed'` with a non-zero
      # exit and no diagnostics, and it lands on a different heavyweight example
      # suite each time (smart-cockpit gateway composition, AI Passport relay).
      # Retry the Windows suite once before failing the job, while preserving
      # the first attempt's log and any Node diagnostic report.
      - if: ${{ runner.os != 'Windows' }}
        run: npm test
      - name: Run the test suite (Windows, one retry on silent process exits)
        id: windows_test
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $logDirectory = Join-Path $env:RUNNER_TEMP 'qwen-audio-test-logs'
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            $logPath = Join-Path $logDirectory "npm-test-attempt-$attempt.log"
            & npm test 2>&1 | Tee-Object -FilePath $logPath
            if ($LASTEXITCODE -eq 0) {
              if ($attempt -gt 1) {
                Add-Content -Path $env:GITHUB_OUTPUT -Value 'retried=true'
                Write-Output "::warning::npm test only passed on attempt $attempt; inspect the uploaded Windows test log and Node report for the first attempt."
              }
              exit 0
            }
            Write-Output "::warning::npm test failed on attempt $attempt on Windows; retrying once."
          }
          Write-Output "::error::npm test failed on both attempts on Windows."
          exit 1
      - run: npm run build
      # Smart Cockpit has its own Vite/ESLint toolchain outside the root
      # workspace graph. Exercise it once on the baseline Linux job instead of
      # duplicating the same frontend build across the full OS/Node matrix.
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '22.22.2' }}
        run: npm ci --prefix examples/smart-cockpit/client --ignore-scripts
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '22.22.2' }}
        run: npm run example:smart-cockpit:lint
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '22.22.2' }}
        run: npm run example:smart-cockpit:build
      - if: ${{ matrix.os == 'macos-latest' && matrix.node == '22.22.2' }}
        run: npm run test:desktop-smoke
      # 真实消费者验收：打包 → 装进只含已声明依赖的裸消费者 → CLI 与
      # Gateway 契约全链路。跑在基线 Node 上，一并证明基线可用。
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '22.22.2' }}
        run: QWEN_AUDIO_CONSUMER_PROBE=1 node --test test/consumer-install.test.mjs
      - run: node scripts/verify-package.mjs
      - name: Upload Windows test diagnostics
        if: ${{ always() && runner.os == 'Windows' && (failure() || steps.windows_test.outputs.retried == 'true') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-diagnostic-reports-node${{ matrix.node }}
          path: |
            ${{ runner.temp }}/qwen-audio-node-reports/
            ${{ runner.temp }}/qwen-audio-test-logs/
          if-no-files-found: ignore
          retention-days: 14

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run release:check
        env:
          # Pull requests remain deterministic during a transient npm audit
          # outage. The release workflow stays fail-closed.
          QWEN_AUDIO_AGENT_AUDIT_ALLOW_UNAVAILABLE: '1'

  # One stable branch-protection context. The matrix job names change whenever
  # the supported OS/Node set changes; this aggregate keeps main protection
  # bound to the complete CI result instead of a fragile list of matrix names.
  required:
    name: required
    if: ${{ always() }}
    needs: [test, release-check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          RELEASE_CHECK_RESULT: ${{ needs.release-check.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$RELEASE_CHECK_RESULT" = success
