<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设置</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand-mark" aria-hidden="true">
          <span></span>
        </div>
        <h1>设置</h1>
        <div class="app-meta">
          <span id="updater-status"></span>
          <button id="check-updates" class="text-button" type="button">检查更新</button>
        </div>
      </header>

      <section class="runtime-status" aria-labelledby="runtime-status-title">
        <h2 id="runtime-status-title">运行状态</h2>
        <dl>
          <div>
            <dt>Gateway</dt>
            <dd id="current-gateway" class="connection-status checking">正在检查…</dd>
          </div>
          <div>
            <dt>Realtime</dt>
            <dd id="current-realtime">正在检查…</dd>
          </div>
          <div>
            <dt>后台 Agent</dt>
            <dd id="current-backend" class="connection-status checking">正在检查…</dd>
          </div>
        </dl>
      </section>

      <form id="settings-form">
        <nav class="settings-tabs" role="tablist" aria-label="设置分类">
          <button
            id="voice-tab"
            class="settings-tab active"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="voice-settings"
            data-settings-tab="voice"
          >语音前台</button>
          <button
            id="backend-tab"
            class="settings-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="backend-settings"
            data-settings-tab="backend"
          >后台 Agent</button>
          <button
            id="app-tab"
            class="settings-tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="app-settings"
            data-settings-tab="app"
          >应用</button>
        </nav>
        <div class="settings-groups">
          <section
            id="voice-settings"
            class="settings-group"
            role="tabpanel"
            aria-labelledby="voice-tab"
            data-settings-panel="voice"
          >
            <div class="settings-group-heading provider-heading">
              <fieldset
                id="realtime-provider"
                class="provider-segmented"
                aria-label="选择实时语音引擎"
              >
                <legend>选择实时语音引擎</legend>
                <label class="provider-segment">
                  <input
                    type="radio"
                    name="realtime-provider"
                    value="dashscope"
                    checked
                  />
                  <span>Qwen Audio</span>
                </label>
                <label class="provider-segment">
                  <input
                    type="radio"
                    name="realtime-provider"
                    value="speech-to-speech"
                  />
                  <span>Speech-to-Speech</span>
                </label>
              </fieldset>
            </div>
            <div class="settings-card">
              <div class="provider-panel" data-provider-panel="dashscope">
                <div class="setting-row api-key-row">
                  <label for="dashscope-api-key">API Key</label>
                  <div class="field-with-action">
                    <input
                      id="dashscope-api-key"
                      type="password"
                      autocomplete="off"
                      spellcheck="false"
                      placeholder="sk-…"
                    />
                    <button id="get-api-key" class="link-button" type="button">
                      获取 API Key
                      <span aria-hidden="true">↗</span>
                    </button>
                  </div>
                </div>

                <div class="setting-row">
                  <label for="realtime-model">前台模型</label>
                  <select id="realtime-model">
                    <option value="qwen-audio-3.0-realtime-plus">
                      qwen-audio-3.0-realtime-plus
                    </option>
                    <option value="qwen-audio-3.0-realtime-flash">
                      qwen-audio-3.0-realtime-flash
                    </option>
                  </select>
                </div>
                <p class="provider-attribution">Qwen-Audio-Realtime · DashScope</p>
              </div>

              <div
                class="provider-panel"
                data-provider-panel="speech-to-speech"
                hidden
              >
                <div class="setting-row service-url-row">
                  <label for="speech-to-speech-url">服务地址</label>
                  <input
                    id="speech-to-speech-url"
                    type="url"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="ws://127.0.0.1:8765/v1/realtime"
                  />
                </div>

                <div class="setting-row">
                  <label for="speech-to-speech-token">访问令牌</label>
                  <input
                    id="speech-to-speech-token"
                    type="password"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="可选，用于 Bearer 认证"
                  />
                </div>
                <p class="provider-attribution">
                  Speech-to-Speech · Hugging Face · 需单独启动本地服务
                </p>
              </div>
            </div>
          </section>

          <section
            id="backend-settings"
            class="settings-group"
            role="tabpanel"
            aria-labelledby="backend-tab"
            data-settings-panel="backend"
            hidden
          >
            <div class="settings-card">
              <div class="setting-row backend-list-row">
                <span class="setting-label" id="backend-list-label">后台 Agent</span>
                <div class="field-with-action backend-list-action">
                  <!-- 行由 settings.js 按本机检测结果动态渲染 -->
                  <div
                    id="backend-list"
                    role="radiogroup"
                    aria-labelledby="backend-list-label"
                  ></div>
                  <button
                    id="refresh-backends"
                    class="link-button"
                    type="button"
                    title="重新检测本机已安装的后台 Agent"
                  >刷新</button>
                </div>
              </div>

              <div class="setting-row">
                <label for="backend-model">后台模型</label>
                <input
                  id="backend-model"
                  type="text"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="留空使用默认模型"
                />
              </div>

              <div class="setting-row node-path-row" hidden>
                <label for="node-path">Node.js 路径</label>
                <div class="field-with-action">
                  <input
                    id="node-path"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="例如 C:\tools\nodejs"
                  />
                  <button
                    id="apply-node-path"
                    class="link-button"
                    type="button"
                  >确认</button>
                </div>
                <p class="setting-hint">
                  如果自动检测不到 npm，请在这里填写 Node.js 安装目录（包含 node.exe 的文件夹路径）。
                </p>
              </div>
            </div>
          </section>

          <section
            id="app-settings"
            class="settings-group"
            role="tabpanel"
            aria-labelledby="app-tab"
            data-settings-panel="app"
            hidden
          >
            <div class="settings-card">
              <div class="setting-row">
                <label for="gateway-url">Gateway</label>
                <input id="gateway-url" type="url" spellcheck="false" required />
              </div>

              <div class="setting-row">
                <label for="orb-style">外观</label>
                <select id="orb-style">
                  <option value="fluid">流光声波球</option>
                  <option value="goo">液态渐变球</option>
                </select>
              </div>

              <div class="setting-row">
                <label for="auto-hide-seconds">自动休眠</label>
                <select id="auto-hide-seconds">
                  <option value="0">永不</option>
                  <option value="60">1 分钟</option>
                  <option value="300">5 分钟</option>
                  <option value="600">10 分钟</option>
                </select>
              </div>

              <div class="setting-row">
                <label for="wake-word-enabled">语音唤醒</label>
                <div class="toggle-field">
                  <label class="toggle-switch">
                    <input id="wake-word-enabled" type="checkbox" />
                    <span class="toggle-track"></span>
                  </label>
                  <span class="toggle-hint">休眠后说出"你好千问"即可唤醒</span>
                </div>
              </div>

              <div class="setting-row">
                <label for="wake-shortcut">显示快捷键</label>
                <div class="shortcut-field">
                  <input
                    id="wake-shortcut"
                    type="hidden"
                    value="CommandOrControl+Shift+Space"
                  />
                  <button
                    id="record-wake-shortcut"
                    class="shortcut-recorder"
                    type="button"
                    title="点击后按下新的快捷键"
                  >⇧ ⌘ Space</button>
                  <button
                    id="reset-wake-shortcut"
                    class="shortcut-reset"
                    type="button"
                    aria-label="恢复默认快捷键"
                    title="恢复默认快捷键"
                  >↺</button>
                </div>
              </div>

              <div class="setting-row">
                <span class="setting-label">日志</span>
                <button id="open-logs" class="row-link" type="button">
                  在 Finder 中显示
                  <span aria-hidden="true">›</span>
                </button>
              </div>
            </div>
          </section>
        </div>

        <footer>
          <p id="message" role="status"></p>
          <button class="apply-button" type="submit" disabled>应用</button>
        </footer>
      </form>
    </main>
    <script src="./settings.js" type="module"></script>
  </body>
</html>
