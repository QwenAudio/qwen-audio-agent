  <text x="690" y="481" text-anchor="middle" font-size="11" font-weight="400" fill="#4b5563">Permissions · Session mapping</text>
  <text x="690" y="501" text-anchor="middle" font-size="11" font-weight="400" fill="#4b5563">Observe · abort · validate result</text>

