  <text x="1000" y="466" text-anchor="middle" font-size="12" font-weight="400" fill="#4b5563">Most work completes in this Session</text>
  <text x="1000" y="486" text-anchor="middle" font-size="11" font-weight="400" fill="#4b5563">Orchestrates Layer 3 Sessions by user intent</text>

  <rect x="1170" y="372" width="210" height="184" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
