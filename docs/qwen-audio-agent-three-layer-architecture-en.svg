  <text x="1275" y="250" text-anchor="middle" font-size="11" font-weight="400" fill="#4b5563">Conversation stays available</text>

  <rect x="245" y="405" width="275" height="124" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
