appId: ai.qwenaudio.agent
productName: Qwen Audio Agent
electronVersion: 43.2.0
asar: true
npmRebuild: false
extraMetadata:
  main: desktop/src/main.mjs

directories:
  output: dist/desktop

# 更新元数据（latest-mac.yml）指向 GitHub Releases，由 electron-updater
# 在运行时发现新版本；CI 发布时随 dmg 与 blockmap 一并上传。
publish:
  - provider: github
    owner: QwenAudio
    repo: qwen-audio-agent

files:
  - desktop/src/**/*
  - server/src/**/*
  - shared/**/*
  - web/dist/**/*
  - package.json
  - LICENSE
  - NOTICE
  - THIRD_PARTY_NOTICES.md

extraResources:
  - from: scripts
    to: runtime/scripts
    filter:
      - "**/*"
  - from: config
    to: runtime/config
    filter:
      - "**/*"

mac:
  category: public.app-category.productivity
  icon: desktop/build/icon.icns
  hardenedRuntime: true
  entitlements: desktop/build/entitlements.mac.plist
  entitlementsInherit: desktop/build/entitlements.mac.inherit.plist
  notarize: true
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Qwen Audio Agent 需要使用麦克风进行实时语音对话。
  target:
    - dmg
  artifactName: qwen-audio-agent-${version}-mac-${arch}.${ext}

dmg:
  title: Qwen Audio Agent
  backgroundColor: "#f5f6f7"
  window:
    width: 540
    height: 380
  contents:
    - x: 150
      y: 190
    - x: 390
      y: 190
      type: link
      path: /Applications
