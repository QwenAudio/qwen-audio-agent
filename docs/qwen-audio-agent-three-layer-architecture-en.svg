  <text x="1190" y="449" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">Handled directly by Gateway</text>
  <text x="1190" y="477" text-anchor="start" font-size="12" font-weight="700" fill="#374151">Delegated queries</text>
  <text x="1190" y="496" text-anchor="start" font-size="12" font-weight="400" fill="#4b5563">Queued with priority</text>
  <text x="1190" y="524" text-anchor="start" font-size="12" font-weight="700" fill="#374151">Delegated cancellation</text>
  <text x="1190" y="543" text-anchor="start" font-size="10" font-weight="400" fill="#4b5563">Coordinator first; fallback if busy</text>

