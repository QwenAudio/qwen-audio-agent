name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.22.2, 24.15.0]
        # The package advertises Node 26 support. Validate the new major on
        # Linux without multiplying the full cross-platform matrix.
        include:
          - os: ubuntu-latest
            node: 26.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          registry-url: https://registry.npmjs.org/
      # windows-latest / Node 24 intermittently reports a bare `test failed` at
      # <file>:1:1 with no assertion, i.e. a test-file subprocess dies with a
      # non-zero exit rather than an assertion failing (issue #413). Enable
      # Node's diagnostic report so the next natural occurrence dumps a full
      # stack instead of an undiagnosable red. The report notice is emitted only
      # on an actual fatal error or uncaught exception, so passing runs are
      # unchanged; reports are auto-named per pid, so parallel test subprocesses
      # never collide.
      - if: ${{ matrix.os == 'windows-latest' }}
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/diagnostic-reports"
          {
            echo "NODE_OPTIONS=--report-on-fatalerror --report-uncaught-exception --report-directory=$GITHUB_WORKSPACE/diagnostic-reports"
          } >> "$GITHUB_ENV"
      # Test the GitLab-only synchronizer against disposable local repositories.
      # GitHub Actions never runs the real synchronization job or needs its token.
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '22.22.2' }}
        run: node --test .gitlab/sync-github.test.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Smart Cockpit has its own Vite/ESLint toolchain outside the root
      # workspace graph. Exercise it once on the baseline Linux job instead of
      # duplicating the same frontend build across the full OS/Node matrix.
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '22.22.2' }}
        run: npm ci --prefix examples/smart-cockpit/client --ignore-scripts
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '22.22.2' }}
        run: npm run example:smart-cockpit:lint
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '22.22.2' }}
        run: npm run example:smart-cockpit:build
      - if: ${{ matrix.os == 'macos-latest' && matrix.node == '22.22.2' }}
        run: npm run test:desktop-smoke
      # 真实消费者验收：打包 → 装进只含已声明依赖的裸消费者 → CLI 与
      # Gateway 契约全链路。跑在基线 Node 上，一并证明基线可用。
      - if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '22.22.2' }}
        run: QWEN_AUDIO_CONSUMER_PROBE=1 node --test test/consumer-install.test.mjs
      - run: node scripts/verify-package.mjs
      # Surface any Node diagnostic report captured from the issue #413 flake.
      # Normal runs produce none, so a missing directory is not a failure.
      - if: ${{ always() && matrix.os == 'windows-latest' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: win-diagnostic-reports-node${{ matrix.node }}
          path: diagnostic-reports/
          if-no-files-found: ignore
          retention-days: 7

  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run release:check
        env:
          # Pull requests remain deterministic during a transient npm audit
          # outage. The release workflow stays fail-closed.
          QWEN_AUDIO_AGENT_AUDIT_ALLOW_UNAVAILABLE: '1'

  # One stable branch-protection context. The matrix job names change whenever
  # the supported OS/Node set changes; this aggregate keeps main protection
  # bound to the complete CI result instead of a fragile list of matrix names.
  required:
    name: required
    if: ${{ always() }}
    needs: [test, release-check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          RELEASE_CHECK_RESULT: ${{ needs.release-check.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$RELEASE_CHECK_RESULT" = success
