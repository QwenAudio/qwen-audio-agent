name: Release

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
      - package.json
      - package-lock.json
      - server/package.json
      - web/package.json
      - tui/package.json
      - desktop/package.json
      - cli/package.json
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version to publish or recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      manual: ${{ steps.plan.outputs.manual }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a release version change
        id: plan
        env:
          RELEASE_BEFORE_SHA: ${{ github.event.before }}
          RELEASE_REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/release-plan.mjs
      - name: Verify the release PR branch
        if: ${{ github.event_name == 'push' && steps.plan.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -eu
          RELEASE_HEAD=$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GH_REPO}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.ref // ""'
          )
          case "$RELEASE_HEAD" in
            release/"$RELEASE_VERSION"|release/v"$RELEASE_VERSION"|release-"$RELEASE_VERSION"|release-v"$RELEASE_VERSION"|*/release-"$RELEASE_VERSION"|*/release-v"$RELEASE_VERSION")
              ;;
            *)
              echo "Version changes must be merged from a dedicated release branch; got '${RELEASE_HEAD}'." >&2
              exit 1
              ;;
          esac

  verify:
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run release:check

  tag:
    needs: [plan, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create or verify the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_MANUAL: ${{ needs.plan.outputs.manual }}
        run: |
          set -eu
          if EXISTING=$(
            gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.sha' 2>/dev/null
          ); then
            git fetch --force origin \
              "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            RESOLVED=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$RESOLVED" != "$GITHUB_SHA" ]; then
              if [ "$RELEASE_MANUAL" = "true" ]; then
                echo "Recovering the existing ${RELEASE_TAG} at ${RESOLVED}."
              else
                echo "${RELEASE_TAG} already points to ${RESOLVED}, not ${GITHUB_SHA}." >&2
                exit 1
              fi
            fi
          else
            gh api \
              --method POST \
              "repos/${GH_REPO}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" \
              -f "sha=${GITHUB_SHA}"
          fi

  npm:
    needs: [plan, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org/
      - name: Check whether npm already has this version
        id: npm
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if npm view "qwen-audio-agent@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.npm.outputs.published != 'true' }}
        run: npm ci
      - if: ${{ steps.npm.outputs.published != 'true' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  macos:
    needs: [plan, tag]
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Validate macOS release credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          MISSING=""
          for NAME in \
            CSC_LINK \
            CSC_KEY_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then
              MISSING="${MISSING} ${NAME}"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "Missing GitHub Actions secrets:${MISSING}" >&2
            exit 1
          fi
      - name: Build, sign and notarize universal macOS DMG
        run: npm run desktop:build -- --universal --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.blockmap
            dist/desktop/latest-mac.yml
          if-no-files-found: error

  windows:
    needs: [plan, tag]
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Validate Windows release credentials
        run: node scripts/check-windows-release-env.mjs
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Build and sign Windows x64 NSIS installer
        run: npm run desktop:build:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Verify Windows Authenticode signatures
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'dist/desktop/*windows-x64.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one signed Windows x64 installer."
          }
          $updatePath = (Get-Content 'dist/desktop/latest.yml' |
            Where-Object { $_ -match '^path: ' }).Substring(6)
          if (-not (Test-Path (Join-Path 'dist/desktop' $updatePath))) {
            throw "Windows update metadata references a missing installer."
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode status: $($signature.Status)"
            }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-nsis
          path: |
            dist/desktop/*windows-x64.exe
            dist/desktop/*.blockmap
            dist/desktop/latest.yml
          if-no-files-found: error

  github-release:
    needs: [plan, tag, npm, macos, windows]
    if: ${{ always() && needs.npm.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.macos.result == 'success' }}
        with:
          name: macos-dmg
          path: artifacts/macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-nsis
          path: artifacts/windows
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --verify-tag --generate-notes
      - name: Upload macOS desktop artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/macos/* --clobber
      - name: Upload Windows desktop artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/windows/* --clobber
